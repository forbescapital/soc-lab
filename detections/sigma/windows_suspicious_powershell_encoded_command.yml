title: suspicious_powershell_encoded_command
id: 4d12d9c2-5c8d-4adc-a0e6-6ec9018a022e
status: experimental
description: Detects suspicious PowerShell execution with encoded command arguments.
author: Security Lab
date: 2026-10-28
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    CommandLine|contains: 'EncodedCommand'
  condition: selection
falsepositives:
  - legitimate administrative automation
  - vendor software with encoded script execution
level: high
